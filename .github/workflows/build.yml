name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # বিল্ড দ্রুত করার জন্য ক্যাশ যোগ করা হয়েছে

      - name: Install Dependencies
        run: npm install --force

      - name: Build Web Project
        run: |
          npm run build -- --base=./ || npm run build
          # নিশ্চিত করুন যে dist ফোল্ডারটি তৈরি হয়েছে
          if [ ! -d "dist" ]; then
            echo "Error: Build folder 'dist' not found!"
            exit 1
          fi

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # সরাসরি কনফিগ ফাইল তৈরি
          printf '{"appId":"com.ec3.aoo","appName":"Delivery Hero","webDir":"dist","server":{"androidScheme":"https","cleartext":true}}' > capacitor.config.json
          npx cap add android || true
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
