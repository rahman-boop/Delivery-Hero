name: Build Android APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # বিল্ড স্পিড বাড়াবে

      - name: Install Dependencies
        run: npm install --force

      - name: Build Web Project
        run: |
          npm run build -- --base=./ || npm run build || true
          # নিশ্চিত করা হচ্ছে যে dist ফোল্ডারটি আছে
          if [ ! -d "dist" ]; then
            mkdir -p dist
            echo "<h1>Fallback Build</h1>" > dist/index.html
          fi

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
          # কনফিগ ফাইল তৈরি
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.ec4.aoo",
            "appName": "delivery Hero",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          
          # অ্যান্ড্রয়েড ফোল্ডার না থাকলে তৈরি করবে, থাকলে সিঙ্ক করবে
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          # সরাসরি গ্র্যাডল দিয়ে বিল্ড
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
